<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Profile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-overlay"></div>

    <div id="card">
        <div class="header">
            <video class="header-video" autoplay loop muted playsinline>
                <source src="bg.mp4" type="video/mp4">
            </video>
        </div>

        <div class="profile-wrap">
            <div class="avatar-frame">
                <img class="avatar" src="p.jpg" alt="Zen">
            </div>
        </div>

        <div class="content">
            <div class="name-row">
                <h3>Zen</h3>
                <span class="verified">✔</span>
            </div>
            <p class="username">@Zen1tsuuu</p>

            <div class="about">
                <span class="about-label">About</span>
                <p class="about-text">Frontend developer

            <div class="stats">
                <div class="stat">
                    <b>17</b>
                    <span>Post</span>
                </div>
                <div class="stat">
                    <b>3</b>
                    <span>Following</span>
                </div>
                <div class="stat">
                    <b>2.01k</b>
                    <span>Followers</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
